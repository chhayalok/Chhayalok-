*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,"Noto Sans Bengali","Hind Siliguri",sans-serif;padding-bottom:96px}

button,input,select{font:inherit;color:var(--tx)}
button{cursor:pointer}.ol{background:transparent;border:1.5px solid var(--bl);color:var(--bl);border-radius:10px;padding:9px 16px;font-weight:600}.sq{width:52px;font-size:22px;padding:6px}
.pb{background:var(--bl);color:var(--card);border:0;border-radius:10px;padding:11px 18px;font-weight:700}.rd{border-color:var(--red);color:var(--red)}
input[type=text],input[type=time],input[type=date],input[type=number],select{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;font-size:16px}

.t.ok{background:var(--grb);border-color:var(--gr)}.t.ov{background:var(--redb);border-color:var(--red)}.t.lt{background:var(--amb);border-color:var(--am)}
.chk{width:44px;height:44px;accent-color:var(--gr);flex:none;margin:0}.nm{font-size:18px;font-weight:700}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:10px}.g2 label{font-size:13px;color:var(--mut)}.g2 div{font-weight:600}
.red{color:var(--red)}.am{color:var(--am)}.gr{color:var(--gr)}.mut{color:var(--mut)}
.ph{display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px dashed var(--mut);border-radius:10px;padding:10px 6px;cursor:pointer;font-size:15px}
img.th{height:60px;border-radius:8px;margin-top:6px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px}.st .card{margin:0}.st b{font-size:30px;display:block}
.ln{padding:10px 0;border-top:1px solid var(--bd)}.ln:first-of-type{border-top:0}
.chip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--mut);border-radius:30px;padding:6px 6px 6px 16px;margin:0 8px 8px 0;font-size:18px}.chip a{width:32px;height:32px;border-radius:50%;background:var(--bd);display:grid;place-items:center;text-decoration:none;color:var(--tx)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:9}
nav button{flex:1;border:0;background:none;border-radius:14px;padding:6px 0;color:var(--mut);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px}nav button b{font-size:22px;font-weight:400}nav button.on{background:var(--nav);color:var(--bl);font-weight:700}
.msg{padding:40px 10px;text-align:center;color:var(--mut)}
</style></head><body>
<div id="hd"></div><main id="app"><div class="msg">লোড হচ্ছে…</div></main><nav id="nav"></nav>
<style>
#lg{position:fixed;inset:0;background:var(--bg);z-index:99;display:none;align-items:center;justify-content:center;padding:20px}

<div id="lg"><form onsubmit="doLogin();return false"><h2>দৈনিক কাজের হিসাব</h2><input id="le" type="email" placeholder="ইমেইল" autocomplete="username"><input id="lp" type="password" placeholder="পাসওয়ার্ড" autocomplete="current-password"><p id="lm"></p><button class="pb" type="submit">লগইন</button></form></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
firebase.initializeApp({apiKey:"AIzaSyDt2pJrPUfP7G_UQP5-zyDUUauSsQCCmVk",authDomain:"chhayalok-f6fcd.firebaseapp.com",projectId:"chhayalok-f6fcd",storageBucket:"chhayalok-f6fcd.firebasestorage.app",messagingSenderId:"355241574332",appId:"1:355241574332:web:edc6ed344e706b8c11b5b9"});
const auth=firebase.auth(),fs=firebase.firestore();
fs.settings({ignoreUndefinedProperties:true});
fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
const sn=d=>({id:d.id,exists:d.exists,data:()=>d.data()}),PC={};
const dbShim={
 doc:p=>{const r=fs.doc(p);return{set:d=>r.set(d),update:d=>r.update(d),delete:()=>r.delete(),onSnapshot:(n,e)=>r.onSnapshot(s=>n(sn(s)),e||(()=>{}))}},
 collection:p=>{const c=fs.collection(p);return{onSnapshot:(n,e)=>c.onSnapshot(s=>n({docs:s.docs.map(sn)}),e||(()=>{}))}}};
const toURL=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
const assetsShim={
 async upload(b){const data=await toURL(b),id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  await fs.doc('photos/'+id).set({data});await fs.doc('photometa/'+id).set({size:data.length,createdAt:Date.now()});PC[id]=data;return{id}},
 async list(){const s=await fs.collection('photometa').get();let bytes=0;
  const assets=s.docs.map(d=>{const v=d.data();bytes+=v.size||0;return{id:d.id,createdAt:new Date(v.createdAt).toISOString(),sizeBytes:v.size||0}});
  return{assets,usage:{files:assets.length,bytes,maxFiles:1e6,maxBytes:1073741824}}},
 async delete(id){await fs.doc('photos/'+id).delete();await fs.doc('photometa/'+id).delete();delete PC[id]}};
const dlShim={save:async({filename,data})=>{const u=URL.createObjectURL(data),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}};
async function hydrate(){document.querySelectorAll('img[data-p]:not([src])').forEach(async i=>{const id=i.dataset.p;
 try{if(!PC[id]){const s=await fs.doc('photos/'+id).get();if(!s.exists)throw 0;PC[id]=s.data().data}i.src=PC[id]}catch(e){i.outerHTML='<small class="mut">ছবি নেই</small>'}})}
const ready=new Promise(res=>auth.onAuthStateChanged(u=>{document.getElementById('lg').style.display=u?'none':'flex';if(u)res()}));
function logout(){if(confirm('লগআউট করবেন?'))auth.signOut().then(()=>location.reload())}
async function doLogin(){const m=document.getElementById('lm');m.textContent='';
 try{await auth.signInWithEmailAndPassword(document.getElementById('le').value.trim(),document.getElementById('lp').value)}catch(e){m.textContent='ইমেইল বা পাসওয়ার্ড ঠিক নয়'}}
window.claude={use:async n=>{await ready;return n==='db'?dbShim:n==='assets'?assetsShim:n==='downloads'?dlShim:null}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
<script>
const $=s=>document.querySelector(s),BD='০১২৩৪৫৬৭৮৯',B=n=>String(n).replace(/\d/g,d=>BD[d]);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tz='Asia/Dhaka',fmt=d=>new Intl.DateTimeFormat('en-CA',{timeZone:tz}).format(d),today=()=>fmt(new Date());
const nowHM=()=>new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date());
const mn=t=>{const[a,b]=t.split(':');return +a*60+ +b};
const PER=h=>h<4?'রাত':h<6?'ভোর':h<12?'সকাল':h<15?'দুপুর':h<18?'বিকাল':h<20?'সন্ধ্যা':'রাত';
const fT=t=>{if(!t)return'—';const[h,m]=t.split(':').map(Number);return PER(h)+' '+B(h%12||12)+':'+B(String(m).padStart(2,'0'))};
const dur=m=>{const h=Math.floor(m/60),r=m%60;return((h?B(h)+' ঘণ্টা ':'')+(r||!h?B(r)+' মিনিট':'')).trim()};
const dl=d=>new Intl.DateTimeFormat('bn-BD',{timeZone:tz,weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date(d+'T12:00:00+06:00'));
const CAT={daily:'দৈনিক কাজ',weekly:'সাপ্তাহিক কাজ',need:'প্রয়োজনভিত্তিক কাজ',field:'মাঠের কাজ'},ORD=['daily','weekly','need','field'];
const catOf=t=>t.cat||(t.sec==='field'?'field':t.id==='W016'?'weekly':/^W01[78]$/.test(t.id)?'need':'daily');
let db,assets,cfg={tasks:[],people:[]},E={},date=today(),tab='shed',unsub=null,cfgRef,me='',chg=false,editing='',usage=null;
try{me=localStorage.getItem('me')||''}catch(e){}
const uid=()=>'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const act=()=>cfg.tasks.filter(t=>t.on!==false);
const done=t=>E[t.id]&&E[t.id].done===true;
const over=t=>!!t.time&&(date<today()||(date===today()&&mn(nowHM())>mn(t.time)));
const liveLate=t=>date===today()&&t.time&&!done(t)?Math.max(0,mn(nowHM())-mn(t.time)):0;
const save=()=>cfgRef.set({tasks:cfg.tasks,people:cfg.people}).catch(()=>alert('সংরক্ষণ হয়নি'));
const put=(id,o)=>{const r=db.doc(`days/${date}/entries/${id}`);return E[id]?r.update(o):r.set({done:false,at:'',late:0,by:'',note:'',photo:'',...o})};
const lateOf=(t,at)=>t.time?Math.max(0,mn(at)-mn(t.time)):0;
function needMe(id){const by=(E[id]||{}).by||me;if(!by){alert('আগে "আপনি" অংশ থেকে নিজের নাম বেছে নিন');render();return ''}return by}
function tick(id,on){const t=cfg.tasks.find(x=>x.id===id),e=E[id]||{};
 if(!on){put(id,{done:false,at:'',late:0});return}
 const by=needMe(id);if(!by)return;const at=e.at||nowHM();put(id,{done:true,at,late:lateOf(t,at),by})}
function setAt(id,v){const t=cfg.tasks.find(x=>x.id===id);if(!v){put(id,{done:false,at:'',late:0});return}
 const by=needMe(id);if(!by)return;put(id,{done:true,at:v,late:lateOf(t,v),by})}
async function photo(id,f){if(!f)return;try{const im=await createImageBitmap(f),k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');
 c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
 const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.7)),r=await assets.upload(b);put(id,{photo:r.id})}catch(e){alert('ছবি আপলোড হয়নি')}}
function setMe(v){me=v;chg=false;try{localStorage.setItem('me',me)}catch(e){}render()}
function shift(n){const d=new Date(date+'T12:00:00+06:00');d.setDate(d.getDate()+n);date=fmt(d);sub()}
function head(){
 let h=`<div class="top"><h1>দৈনিক কাজের হিসাব</h1><span class="live"><i></i>লাইভ</span></div>`;
 if(tab==='list'||tab==='med')return h;
 h+=`<div class="db"><button class="ol sq" onclick="shift(-1)">‹</button><div class="dc"><b>${dl(date)}</b><small>${date===today()?'আজ':'&nbsp;'}</small></div><button class="ol sq" onclick="shift(1)">›</button><button class="ol" onclick="date=today();sub()">আজ</button></div>`;
 const dy=act().filter(t=>catOf(t)==='daily'),dn=dy.filter(done).length,ov=dy.filter(t=>!done(t)&&over(t)).length,n=dy.length||1;
 if(tab==='field'){const f=act().filter(t=>catOf(t)==='field');return h+`<div class="pl"><b>${B(f.filter(done).length)}টি কাজ করা হয়েছে</b><span>মাঠের মোট ${B(f.length)}টি কাজের মধ্যে</span></div>`}
 return h+`<div class="pl"><b>${B(dy.length)}টির মধ্যে ${B(dn)}টি সম্পন্ন</b><span>${ov?'সময় পেরিয়েছে '+B(ov):''}</span></div><div class="bar"><i style="width:${dn/n*100}%;background:var(--gr)"></i><i style="width:${ov/n*100}%;background:var(--red)"></i></div>`}
function meCard(){return `<div class="card row sp">`+(me&&!chg?`<div>আপনি: <b>${esc(me)}</b></div><button class="ol" onclick="chg=true;render()">বদলান</button>`:`<select onchange="setMe(this.value)"><option value="">আপনি কে? নাম বেছে নিন</option>${cfg.people.map(p=>`<option ${p===me?'selected':''}>${esc(p)}</option>`).join('')}</select>`)+`</div>`}
function card(t){const e=E[t.id]||{},d=done(t),ll=liveLate(t),cl=d?(e.late>0?'lt':'ok'):(!d&&over(t)?'ov':''),f=catOf(t)==='field';
 const dc=d?(e.late>0?`<span class="am">${dur(e.late)} দেরি</span>`:'<span class="gr">দেরি নেই</span>'):ll?`<span class="red">এখন ${dur(ll)} দেরি</span>`:'—';
 return `<div class="card t ${cl}"><div class="row"><input type="checkbox" class="chk" ${d?'checked':''} onchange="tick('${t.id}',this.checked)"><div class="nm">${esc(t.name)}</div></div>
 <div class="g2"><div><label>নির্ধারিত সময়</label><div>${t.time?fT(t.time):'নির্ধারিত নেই'}</div></div><div><label>সম্পাদন সময়</label><input type="time" value="${e.at||''}" onchange="setAt('${t.id}',this.value)"></div>
 <div><label>দেরি</label><div>${dc}</div></div><div><label>ছবি</label>${assets?`<label class="ph"><input type="file" accept="image/*" hidden onchange="photo('${t.id}',this.files[0])">📷 ${e.photo?'ছবি বদলান':'ছবি তুলুন'}</label>`:'<div>—</div>'}${e.photo?`<img class="th" data-p="${e.photo}" onerror="this.outerHTML='<small class=mut>ছবি মুছে ফেলা হয়েছে</small>'">`:''}</div></div>
 <div style="margin-top:10px"><label class="mut" style="font-size:13px">তদারকি</label><select onchange="put('${t.id}',{by:this.value})"><option value="">নাম বেছে নিন</option>${cfg.people.map(p=>`<option ${p===e.by?'selected':''}>${esc(p)}</option>`).join('')}</select></div>
 ${f?`<div style="margin-top:10px"><label class="mut" style="font-size:13px">কোথায় / মন্তব্য</label><input type="text" placeholder="যেমন: উত্তর পাশের মাঠ" value="${esc(e.note||'')}" onchange="put('${t.id}',{note:this.value})"></div>`:''}</div>`}
function work(cats){let h=meCard(),any=false;
 cats.forEach(c=>{const ts=act().filter(t=>catOf(t)===c);if(!ts.length)return;any=true;h+=`<h3>${CAT[c]}<span>${B(ts.length)}টি</span></h3>`+ts.map(card).join('')});
 return any?h:h+'<div class="msg">কোনো কাজ নেই। "তালিকা" ট্যাবে কাজ যোগ করুন।</div>'}
function rows(){return act().sort((a,b)=>ORD.indexOf(catOf(a))-ORD.indexOf(catOf(b))).map(t=>({t,e:E[t.id]||{},d:done(t)}))}
function counts(){const r={ok:0,lt:0,pend:0,by:{},ph:0,dn:0,dy:0};
 act().forEach(t=>{const d=done(t),e=E[t.id]||{};if(catOf(t)==='daily'){r.dy++;if(!d)r.pend++;else e.late>0?r.lt++:r.ok++}
  if(d){r.dn++;r.by[e.by]=(r.by[e.by]||0)+1;if(e.photo)r.ph++}});return r}
function rep(){const r=counts(),R=rows(),pd=R.filter(x=>!x.d&&catOf(x.t)==='daily'),dn=R.filter(x=>x.d);
 return `<div class="st"><div class="card"><b class="gr">${B(r.ok)}</b>সময়মতো</div><div class="card"><b class="am">${B(r.lt)}</b>দেরিতে</div><div class="card"><b class="red">${B(r.pend)}</b>বাকি</div></div>
 <p class="mut" style="font-size:14px">নির্ধারিত দৈনিক কাজ ${B(r.dy)}টি। ছবি জমা ${B(r.ph)}/${B(r.dn)} (সম্পন্ন কাজের মধ্যে)।</p>
 ${pd.length?`<div class="card"><div class="row sp"><b>বাকি কাজ</b><span class="mut">${B(pd.length)}টি</span></div>${pd.map(x=>{const l=liveLate(x.t);return `<div class="ln"><div>${esc(x.t.name)}</div><div class="red" style="font-size:14px">নির্ধারিত ${x.t.time?fT(x.t.time):'নেই'}${l?' · এখন '+dur(l)+' দেরি':''}</div></div>`}).join('')}</div>`:''}

 M.use.forEach(u=>{const o=g[bkey(u)];if(o)o.out+=+u.qty||0});return Object.values(g)}

 M.sch.filter(r=>!r.done).forEach(r=>{const d=dd(r.planned);if(d<0)a.push(`<div class="red">⚠ ${esc(r.name)}: ${B(-d)} দিন দেরি</div>`);else if(d===0)a.push(`<div class="am">💊 আজ প্রয়োগের দিন: ${esc(r.name)}</div>`);else if(d===1)a.push(`<div class="am">🔔 আগামীকাল প্রয়োগ: ${esc(r.name)}</div>`)});
 const ex=bal().filter(o=>o.exp&&dd(o.exp)<=30&&o.in-o.out>0).length;if(ex)a.push(`<div class="red">⏳ ${B(ex)}টি মেডিসিনের মেয়াদ ৩০ দিনের মধ্যে শেষ হবে</div>`);
 return a.length?`<div class="card" style="border-color:var(--am)">${a.join('')}</div>`:''}
async function shrink(f){const im=await createImageBitmap(f),k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.7))}
function mFormH(k){return `<div class="card"><b>নতুন ${ML[k]}</b><div style="display:grid;gap:10px;margin-top:10px">`+FS[k].map(([f,l,t,o])=>`<div><label class="mut" style="font-size:13px">${l}</label>`+(t==='sel'?`<select id="f_${f}">${o.map(v=>`<option>${v}</option>`).join('')}</select>`:t==='person'?`<select id="f_${f}"><option value="">নাম বেছে নিন</option>${cfg.people.map(p=>`<option ${p===me?'selected':''}>${esc(p)}</option>`).join('')}</select>`:`<input id="f_${f}" type="${t}" ${t==='number'?'inputmode="decimal" step="any"':''} ${t==='date'&&f==='date'?`value="${today()}"`:''} ${f==='name'?'list="mn"':''}>`)+`</div>`).join('')+(k==='buy'?`<div><label class="mut" style="font-size:13px">মেডিসিনের ছবি</label><input id="f_photo" type="file" accept="image/*"></div>`:'')+`<div class="row"><button class="pb" onclick="mSave('${k}')">সংরক্ষণ</button><button class="ol" onclick="mform=false;render()">বাতিল</button></div></div></div>`}
async function mSave(k){const o={};FS[k].forEach(([f])=>{o[f]=$('#f_'+f).value.trim()});
 if(!o.name){alert('নাম লিখুন');return}
 if(k==='buy'){const f=$('#f_photo').files[0];o.photo='';if(f&&assets){try{o.photo=(await assets.upload(await shrink(f))).id}catch(e){alert('ছবি আপলোড হয়নি, ছবি ছাড়া সংরক্ষণ হচ্ছে')}}}
 o.at=Date.now();mform=false;await db.doc(MC[k]+'/'+uid()).set(o).catch(()=>alert('সংরক্ষণ হয়নি'));render()}
function mDel(k,id){if(confirm('মুছে ফেলবেন?'))db.doc(MC[k]+'/'+id).delete()}
async function mTick(id,on){const r=M.sch.find(x=>x.id===id),s=db.doc('medsch/'+id);
 if(!on){await s.update({done:false,doneDate:'',by:''});db.doc('meduse/u_'+id).delete().catch(()=>{});return}
 if(!me){alert('আগে ওপরের "আপনি" অংশ থেকে নিজের নাম বেছে নিন');render();return}
 let reason='';if(today()>r.planned)reason=prompt('দেরির কারণ লিখুন')||'';
 await s.update({done:true,doneDate:today(),by:me});
 await db.doc('meduse/u_'+id).set({name:r.name,code:r.code||'',qty:r.qty||'',by:me,date:today(),planned:r.planned,reason,at:Date.now()})}
const rec=(k,r)=>`<div class="card"><div class="row sp"><div class="nm">${esc(r.name)}</div><button class="ol rd" style="padding:4px 10px" onclick="mDel('${k}','${r.id}')">মুছুন</button></div><div class="g2">${FS[k].filter(x=>x[0]!=='name').map(([f,l,t])=>r[f]?`<div><label>${l}</label><div style="font-weight:500">${t==='date'?fd(r[f]):esc(r[f])}</div></div>`:'').join('')}${k==='use'&&r.date&&r.planned&&r.date>r.planned?`<div><label>দেরি</label><div class="red">${B(Math.round((new Date(r.date)-new Date(r.planned))/864e5))} দিন</div></div>`:''}</div>${r.photo?`<img class="th" style="height:90px" data-p="${r.photo}" onerror="this.remove()">`:''}</div>`;
const sc=r=>{const d=r.done,df=dd(r.planned);return `<div class="card t ${d?'ok':df<0?'ov':df<=1?'lt':''}"><div class="row"><input type="checkbox" class="chk" ${d?'checked':''} onchange="mTick('${r.id}',this.checked)"><div style="flex:1"><div class="nm">${esc(r.name)}</div><div class="mut" style="font-size:14px">${r.code?'কোড '+esc(r.code)+' · ':''}${r.qty?'পরিমাণ '+B(r.qty)+' · ':''}প্রয়োগ: ${fd(r.planned)}</div><div style="font-size:14px;font-weight:600" class="${d?'gr':df<0?'red':'am'}">${d?'সম্পন্ন '+fd(r.doneDate)+' · '+esc(r.by||''):df<0?B(-df)+' দিন দেরি':df===0?'আজই প্রয়োগের দিন':df===1?'আগামীকাল প্রয়োগ':B(df)+' দিন বাকি'}</div></div><button class="ol rd" style="padding:4px 10px" onclick="mDel('sch','${r.id}')">মুছুন</button></div></div>`};
function mBal(){const g=bal().sort((a,b)=>(a.exp||'9')<(b.exp||'9')?-1:1);
 return `<p class="mut" style="font-size:14px">লাল দাগ = মেয়াদ ৩০ দিনের মধ্যে শেষ বা শেষ হয়ে গেছে। ব্যালেন্স = মোট ক্রয় − ব্যবহার (কোড মিলিয়ে)।</p>`+(g.length?g.map(o=>{const rem=o.in-o.out,dl=o.exp?dd(o.exp):999,red=dl<=30;
 return `<div class="card ${red?'t ov':''}"><div class="row sp"><div class="nm">${esc(o.name)}</div><b style="font-size:20px">${B(+rem.toFixed(2))} ${esc(o.unit||'')}</b></div><div class="mut" style="font-size:14px">${o.code?'কোড '+esc(o.code)+' · ':''}${o.kind||''} · ক্রয় ${B(o.in)} − ব্যবহার ${B(o.out)}</div><div class="${red?'red':''}" style="font-weight:600">${o.exp?'মেয়াদ: '+fd(o.exp)+(dl<0?' · মেয়াদ উত্তীর্ণ':' · '+B(dl)+' দিন বাকি'):'মেয়াদ দেওয়া নেই'}</div></div>`}).join(''):'<div class="msg">ক্রয়ের তথ্য যোগ করলে ব্যালেন্স দেখা যাবে।</div>')}
function med(){const k=mtab;let L='';
 if(k!=='bal'){const a=[...M[k]];if(k==='sch')a.sort((x,y)=>(x.done?1:0)-(y.done?1:0)||(x.planned>y.planned?1:-1));else a.sort((x,y)=>(y.date||'')>(x.date||'')?1:-1);L=a.map(r=>k==='sch'?sc(r):rec(k,r)).join('')||'<div class="msg">এখনো কিছু যোগ হয়নি।</div>'}
 return meCard()+`<datalist id="mn">${[...new Set(M.buy.map(b=>b.name))].map(n=>`<option value="${esc(n)}">`).join('')}</datalist><div class="row" style="flex-wrap:wrap;margin-bottom:12px">`+[['buy','ক্রয়'],['use','ব্যবহার'],['sch','সিডিউল'],['bal','ব্যালেন্স']].map(([x,v])=>`<button class="${k===x?'pb':'ol'}" style="padding:8px 14px" onclick="mtab='${x}';mform=false;render()">${v}</button>`).join('')+`<button class="ol" style="padding:8px 14px" onclick="pdf('med')">⬇ PDF</button></div>`
 +(k==='bal'?mBal():(mform?mFormH(k):`<button class="ol" style="width:100%;margin-bottom:12px" onclick="mform=true;render()">+ নতুন ${ML[k]} যোগ করুন</button>`)+L)}
function render(){if(mform&&tab==='med'&&$('#f_name'))return;
 $('#hd').innerHTML=head();
 $('#nav').innerHTML=[['shed','🏠','শেড'],['field','🌱','মাঠ'],['med','💊','মেডিসিন'],['rep','📋','রিপোর্ট'],['list','☰','তালিকা']].map(([k,i,v])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render();scrollTo(0,0);${k==='list'?'loadU()':''}"><b>${i}</b>${v}</button>`).join('');
 $('#app').innerHTML=(tab==='list'?'':alerts())+(tab==='med'?med():tab==='shed'?work(['daily','weekly','need']):tab==='field'?work(['field']):tab==='rep'?rep():list());hydrate()}
function sub(){if(unsub)unsub();E={};render();unsub=db.collection(`days/${date}/entries`).onSnapshot(sn=>{E={};sn.docs.forEach(d=>E[d.id]=d.data());render()})}
(async()=>{
 try{db=await claude.use('db');assets=await claude.use('assets')}catch(e){}
 if(!db){$('#app').innerHTML='<div class="msg">ডেটা সংরক্ষণ চালু নেই। Claude-এ সাইন ইন করে খুলুন।</div>';return}
 cfgRef=db.doc('config/main');
 cfgRef.onSnapshot(s=>{const d=s.data();if(d)cfg=JSON.parse(JSON.stringify({tasks:d.tasks||[],people:d.people||[]}));render()});
 ['buy','use','sch'].forEach(k=>db.collection('med'+k).onSnapshot(s=>{M[k]=s.docs.map(d=>({id:d.id,...d.data()}));render()}));sub();setInterval(()=>{if(tab!=='list'&&!document.activeElement.matches('input,select'))render()},60000)})();
</script></body></html>
